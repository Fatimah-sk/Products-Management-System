<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div class="crud">
        <div class="head">
            <h2>cruds</h2>
            <p>Product Management System</p>
        </div>

        <div class="inputs">
            <input type="text" id="title" placeholder="Product Title">
            <div class="price">
                <input onkeydown="getTotal()" type="number" id="price" placeholder="Price">
                <input onkeydown="getTotal()" type="number" id="taxes" placeholder="Taxes">
                <input onkeydown="getTotal()" type="number" id="ads" placeholder="Ads">
                <input onkeydown="getTotal()" type="number" id="discount" placeholder="Discount">
                <small id="total"></small>
            </div>
            <input type="number" id="count" placeholder="Count">
            <input type="text" id="category" placeholder="Category">
            <button id="submit">Create</button>
        </div>

        <div class="outputs">
            <div class="searchBlock">
                <input onkeyup="searchData(this.value)" type="text" id="search" placeholder="Search">
                <div class="btnsearch">
                    <button onclick=" getSearchMood(this.id)" id="searchTitle" >Search by Title</button>
                    <button onclick=" getSearchMood(this.id)" id="searchCategory">Search by Category</button>
                </div>
            </div>

            <div id="deleteAll">
                
            </div>

            <table>
                <thead>
                    <tr>
                        <th>id</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Taxes</th>
                        <th>Ads</th>
                        <th>Discount</th>
                        <th>Total</th>
                        <th>Category</th>
                        <th>Update</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody id="tBody">
                    <!-- Table rows will be dynamically inserted here -->
                </tbody>
        </div>
    </div>
    
</body>
</html>
